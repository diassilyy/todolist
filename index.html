<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div class="container mt-5 d-flex justify-content-center">
        <div id="app" class="w-50"></div>
    </div>

    <script type="text/babel">
        const { useState } = React;

        function AppTodolist() {
            const [activity, setActivity] = useState("");
            const [todos, setTodos] = useState([]);

            function handleChange(e) {
                setActivity(e.target.value);
            }

            function handleSubmit(e) {
                e.preventDefault();
                if (activity.trim() === "") return;
                setTodos([...todos, activity]);
                setActivity("");
            }

            function handleDelete(index) {
                const newTodos = todos.filter((_, i) => i !== index);
                setTodos(newTodos);
            }

            return (
                <div className="card p-4 shadow-lg border-0 rounded-4">
                    <h1 className="text-center mb-4 fw-bold text-primary">To Do List</h1>
                    <form onSubmit={handleSubmit} className="d-flex gap-2 mb-3">
                        <input 
                            type="text" 
                            className="form-control border-primary shadow-sm" 
                            placeholder="Masukkan aktivitas" 
                            value={activity} 
                            onChange={handleChange} 
                        />
                        <button type="submit" className="btn btn-primary shadow-sm">Tambah</button>
                    </form>
                    <ul className="list-group">
                        {todos.map((todo, index) => (
                            <li key={index} className="list-group-item d-flex justify-content-between align-items-center bg-light shadow-sm rounded-3 mb-2">
                                <span className="fw-medium">{todo}</span>
                                <button className="btn btn-outline-danger btn-sm rounded-circle" onClick={() => handleDelete(index)}>
                                    <i className="bi bi-trash"></i>
                                </button>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("app"));
        root.render(<AppTodolist />);
    </script>
</body>
</html>
